[project]
name = "arlpy"
version = "1.9.4"
description = "ARL Python Tools"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Mandar Chitre", email = "mandar@nus.edu.sg" },
]
keywords = ["underwater acoustics", "signal processing", "communication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bokeh>=3.10.1",
    "matplotlib>=3.9.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "utm>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/org-arl/arlpy"
Documentation = "https://arlpy.readthedocs.io"

