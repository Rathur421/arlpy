[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[project]
name = "arlpy"
version = "1.9.4"
description = "ARL Python Tools"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Mandar Chitre", email = "mandar@nus.edu.sg" },
]
keywords = ["underwater acoustics", "signal processing", "communication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bokeh>=3.10.1",
    "matplotlib>=3.9.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "utm>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/org-arl/arlpy"
Documentation = "https://arlpy.readthedocs.io"

[dependency-groups]
dev = [
    "arlpy",
]
docs = [
    "sphinx>=9.2",
    "pydata-sphinx-theme>=0.24",
    "nbsphinx>=0.9.8",
    "ipykernel>=6",
]

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
arlpy = { workspace = true, editable = true }
